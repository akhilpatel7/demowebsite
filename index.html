<!DOCTYPE html>
<html data-wf-domain="akhilpatel.webflow.io" data-wf-site="624a643e8a6e5ea4d90f80c7">
<head>
  <meta charset="utf-8" />
  <title>Protected page</title>
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link href="css/akhilpatel.webflow.shared.fd93d9695.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
  <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
  <script type="text/javascript">WebFont.load({ google: { families: ["IBM Plex Mono:300,400,500,600,700","IBM Plex Sans:300,400,500,600,700"] } });</script>
  <link href="assets/62858444bc671de5c9ab9b7a_favicon.png" rel="shortcut icon" type="image/x-icon" />
</head>
<body>
  <div class="utility-page-wrap">
    <div class="utility-page-content w-form">
      <form onsubmit="return checkPassword()" class="utility-page-form">
        <div class="div-block-27">
          <div class="div-block-26 pwd">
            <img width="55" alt="" src="assets/62576bc845294d7a01fb717c_New_Moon_Face.png" loading="lazy" class="image-3" />
            <h1 class="heading-7 nav-menu pwddark">Akhil Patel&#x27;s Portfolio</h1>
          </div>
          <div class="superbig gradient white">I hope you have the password. <span class="spanicon">🔑</span></div>
          <label class="text-block-4">If not, feel free to take a guess or visit me on <a href="https://www.linkedin.com/in/akhil-patel/" target="_blank" class="pwdpage">LinkedIn</a>.</label>
        </div>
        <input class="text-field password w-input" autofocus="true" maxlength="256" name="pass" placeholder="Go ahead, type it here..." type="password" id="pass" />
        <input type="submit" class="submit-button pwd w-button" value="Submit" />
        <div id="error-msg" class="error-message w-form-fail" style="display:none">
          <div class="text-block-5">☹️  Incorrect password. (The guess was wild though!)</div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js" type="text/javascript"></script>
  <script src="js/webflow.schunk.36b8fb49256177c8.js" type="text/javascript"></script>
  <script src="js/webflow.schunk.1cc9e8f15c6fc67c.js" type="text/javascript"></script>
  <script src="js/webflow.eb06bb11.ee40d908deed362e.js" type="text/javascript"></script>
  <script>
    var HASHED = "f4d8d581c6c8bd1188783decf76a6293c8f4430dc7268622b14ac7d51d0c6432";

    async function sha256(str) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
    }

    async function checkPassword() {
      var pw = document.getElementById("pass").value;
      var hash = await sha256(pw);
      if (hash === HASHED) {
        sessionStorage.setItem("ap_auth", "1");
        window.location.href = "home.html";
      } else {
        document.getElementById("error-msg").style.display = "block";
        document.getElementById("pass").value = "";
        document.getElementById("pass").focus();
      }
      return false;
    }
  </script>
</body>
</html>
