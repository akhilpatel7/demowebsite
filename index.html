<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Akhil Patel Portfolio</title>
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link href="assets/62858444bc671de5c9ab9b7a_favicon.png" rel="shortcut icon" type="image/x-icon" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background-color: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .utility-page-wrap {
      text-align: center;
      width: 100vw;
      max-width: 100%;
      padding: 24px;
    }

    .utility-page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spanicon {
      font-size: 70px;
      margin-bottom: 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand-row img {
      width: 36px;
      height: 36px;
    }

    .brand-name {
      color: rgba(238, 238, 238, 0.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 500;
    }

    .page-label {
      color: #d15071;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .page-desc {
      color: rgba(255, 255, 255, 0.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 400;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .utility-page-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 800px;
    }

    .text-field {
      background-color: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 30px;
      width: 350px;
      height: 48px;
      padding: 10px 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #fff;
      outline: none;
      text-align: center;
      letter-spacing: 0.1em;
      margin-bottom: 32px;
    }

    .text-field::placeholder {
      color: rgba(238, 238, 238, 0.5);
    }

    .text-field:focus {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .submit-button {
      background-color: #c83660;
      border: none;
      border-radius: 4px;
      width: 350px;
      padding: 15px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0;
      cursor: pointer;
      margin-bottom: 20px;
      transition: opacity 0.2s;
    }

    .submit-button:hover {
      opacity: 0.85;
    }

    .error-msg {
      color: #ff6b6b;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .error-msg.visible {
      opacity: 1;
    }

    @media (max-width: 479px) {
      .text-field, .submit-button { width: 271px; }
      .page-desc { letter-spacing: -0.5px; line-height: 150%; }
    }
  </style>
</head>
<body>
  <div class="utility-page-wrap">
    <div class="utility-page-content">
      <div class="spanicon">🌚</div>
      <div class="brand-row">
        <img src="assets/62576bc845294d7a01fb717c_New_Moon_Face.png" alt="" />
        <span class="brand-name">akhil—patel.</span>
      </div>
      <p class="page-label">Password Protected</p>
      <p class="page-desc">This portfolio is password protected. Please enter the password to view.</p>

      <form class="utility-page-form" onsubmit="return checkPassword()">
        <input
          type="password"
          id="gate-pw"
          class="text-field"
          placeholder="Enter password"
          autocomplete="off"
          autofocus
        />
        <p id="gate-error" class="error-msg">Incorrect password. Try again.</p>
        <button type="submit" class="submit-button">Submit</button>
      </form>
    </div>
  </div>

  <script>
    var HASHED = "f4d8d581c6c8bd1188783decf76a6293c8f4430dc7268622b14ac7d51d0c6432";

    async function sha256(str) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
    }

    async function checkPassword() {
      var pw = document.getElementById("gate-pw").value;
      var hash = await sha256(pw);
      if (hash === HASHED) {
        sessionStorage.setItem("ap_auth", "1");
        window.location.href = "home.html";
      } else {
        document.getElementById("gate-error").classList.add("visible");
        document.getElementById("gate-pw").value = "";
        document.getElementById("gate-pw").focus();
      }
      return false;
    }
  </script>
</body>
</html>
