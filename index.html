<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Akhil Patel Portfolio</title>
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
  <link href="assets/62858444bc671de5c9ab9b7a_favicon.png" rel="shortcut icon" type="image/x-icon" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .gate {
      text-align: center;
      max-width: 400px;
      padding: 40px 24px;
    }

    .gate-emoji {
      width: 64px;
      margin-bottom: 24px;
    }

    .gate-title {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(135deg, #ff6b6b, #ffa500, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .gate-subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 40px;
    }

    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gate-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      padding: 14px 18px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      outline: none;
      text-align: center;
      letter-spacing: 0.15em;
      transition: border-color 0.2s;
    }

    .gate-input::placeholder {
      color: #444;
      letter-spacing: 0.05em;
    }

    .gate-input:focus {
      border-color: #555;
    }

    .gate-btn {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 14px 18px;
      background: #fff;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .gate-btn:hover {
      opacity: 0.85;
    }

    .gate-error {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #ff4444;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .gate-error.visible {
      opacity: 1;
    }

    .gate-hint {
      font-size: 12px;
      color: #333;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="gate">
    <img src="assets/62576bc845294d7a01fb717c_New_Moon_Face.png" alt="" class="gate-emoji" />
    <h1 class="gate-title">akhil—patel.</h1>
    <p class="gate-subtitle">Portfolio</p>

    <form class="gate-form" onsubmit="return checkPassword()">
      <input
        type="password"
        id="gate-pw"
        class="gate-input"
        placeholder="Enter password"
        autocomplete="off"
        autofocus
      />
      <button type="submit" class="gate-btn">View Portfolio</button>
      <p id="gate-error" class="gate-error">Incorrect password. Try again.</p>
    </form>

    <p class="gate-hint">Request access from Akhil</p>
  </div>

  <script>
    var HASHED = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8";

    async function sha256(str) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
    }

    async function checkPassword() {
      var pw = document.getElementById("gate-pw").value;
      var hash = await sha256(pw);
      if (hash === HASHED) {
        sessionStorage.setItem("ap_auth", "1");
        window.location.href = "home.html";
      } else {
        document.getElementById("gate-error").classList.add("visible");
        document.getElementById("gate-pw").value = "";
        document.getElementById("gate-pw").focus();
      }
      return false;
    }
  </script>
</body>
</html>
