<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page Not Found — Akhil Patel</title>
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link href="assets/62858444bc671de5c9ab9b7a_favicon.png" rel="shortcut icon" type="image/x-icon" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background-color: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .utility-page-wrap {
      text-align: center;
      width: 100vw;
      max-width: 100%;
      padding: 24px;
    }

    .utility-page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spanicon {
      font-size: 70px;
      margin-bottom: 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand-row img {
      width: 36px;
      height: 36px;
    }

    .brand-name {
      color: rgba(238, 238, 238, 0.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 500;
    }

    .error-code {
      color: #d15071;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .page-desc {
      color: rgba(255, 255, 255, 0.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 400;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .back-btn {
      display: inline-block;
      background-color: #c83660;
      border-radius: 4px;
      padding: 15px 48px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .back-btn:hover {
      opacity: 0.85;
    }

    @media (max-width: 479px) {
      .page-desc { letter-spacing: -0.5px; line-height: 150%; }
    }
  </style>
</head>
<body>
  <div class="utility-page-wrap">
    <div class="utility-page-content">
      <div class="spanicon">🌚</div>
      <div class="brand-row">
        <img src="assets/62576bc845294d7a01fb717c_New_Moon_Face.png" alt="" />
        <span class="brand-name">akhil—patel.</span>
      </div>
      <p class="error-code">404 — Page Not Found</p>
      <p class="page-desc">The page you're looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="back-btn">Go Home</a>
    </div>
  </div>
</body>
</html>
